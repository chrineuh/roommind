name: ac-direct-own-run
description: >
  Winter, a heat pump split heating a room on its own with setpoint_mode direct. The
  unit gets the room target and regulates in its own deadband (on 0.5 K below, off
  0.5 K above, return-air offset 0 like a unit on a remote sensor). RoomMind used to
  switch it off the moment the room read the target, a few minutes into a compressor
  run the unit would have ended by itself, and back on shortly after, so it started
  about twice as often as on its own thermostat. The cooling side of the same rule:
  override-entity-hot-room-cooling.
refs: [419]
tags: [ac, control]
start: 2026-01-12T00:00
duration: 3d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      floor_area_m2: 25
      initial: {temperature: 20.0, mass_temperature: 20.0}
      windows: [{orientation: S, area_m2: 3}]
      devices: [{entity_id: climate.wz_ac, profile: generic_split_ac, heat_capacity_w: 2500, sensor_offset_heat_k: 0.0}]
      sensors: {temperature: {entity_id: sensor.wz_temp}}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wz_ac, type: ac, setpoint_mode: direct, idle_action: "off"}]
      temperature_sensor: sensor.wz_temp
      climate_mode: heat_only
      comfort_temp: 21.0
      eco_temp: 21.0
expect:
  - {invariant: target_never_empty}
  - {invariant: no_rejected_commands}
  # seeds 1-2: v1.8.0 93/85 starts per day, 18.0/18.1 Kh below the target; since the run is the unit's own: 22/19, 9.7/10.2 Kh (energy +4-5 %)
  - {metric: device.starts_per_day, entity_id: climate.wz_ac, max: 35, label: direct unit ends its own heating runs}
  - {metric: comfort.undershoot_kh, room: wohnzimmer, max: 14, label: the room is held at the target}
