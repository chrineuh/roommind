name: override-entity-hot-room-cooling
description: >
  Tropical afternoon, two AC rooms with setpoint_mode direct and idle_action off. An
  automation turns the per-room override entity on (set_hvac_mode, then set_temperature
  21 °C) and off again 3.5 h later, once in a cool_only room and once in an auto room.
  The units cannot reach 21 °C. While the override holds, the room must keep a target
  and the AC must keep cooling instead of cycling cool/off (#419).
refs: [419]
tags: [ac, override, entities]
start: 2026-09-01T00:00
duration: 3d
location: {latitude: 13.7, longitude: 100.5, time_zone: Asia/Bangkok}
weather: {profile: subtropical-humid}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    schlafzimmer:
      floor_area_m2: 16
      initial: {temperature: 26.0, mass_temperature: 26.0}
      windows: [{orientation: W, area_m2: 3}]
      devices: [{entity_id: climate.sz_ac, profile: daikin_ac, cool_capacity_w: 1500}]
      sensors: {temperature: {entity_id: sensor.sz_temp}}
    wohnzimmer:
      floor_area_m2: 28
      initial: {temperature: 26.0, mass_temperature: 26.0}
      windows: [{orientation: W, area_m2: 5}]
      devices: [{entity_id: climate.wz_ac, profile: daikin_ac, cool_capacity_w: 2500}]
      sensors: {temperature: {entity_id: sensor.wz_temp}}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
    outdoor_cooling_min: 20
  rooms:
    schlafzimmer:
      devices: [{entity_id: climate.sz_ac, type: ac, setpoint_mode: direct, idle_action: "off"}]
      temperature_sensor: sensor.sz_temp
      climate_mode: cool_only
      comfort_temp: 24.0
      comfort_cool: 24.0
      eco_temp: 27.0
      eco_cool: 27.0
    wohnzimmer:
      devices: [{entity_id: climate.wz_ac, type: ac, setpoint_mode: direct, idle_action: "off"}]
      temperature_sensor: sensor.wz_temp
      climate_mode: auto
      comfort_heat: 20.0
      comfort_cool: 23.0
      eco_heat: 18.0
      eco_cool: 27.0
timeline:
  - {at: "+2d15h45m", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_schlafzimmer_override, hvac_mode: cool}}
  - {at: "+2d15h45m20s", do: ha.service, service: climate.set_temperature, data: {entity_id: climate.roommind_schlafzimmer_override, temperature: 21.0}}
  - {at: "+2d15h45m", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_wohnzimmer_override, hvac_mode: heat_cool}}
  - {at: "+2d15h45m20s", do: ha.service, service: climate.set_temperature, data: {entity_id: climate.roommind_wohnzimmer_override, temperature: 21.0}}
  - {at: "+2d19h22m", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_schlafzimmer_override, hvac_mode: "off"}}
  - {at: "+2d19h22m", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_wohnzimmer_override, hvac_mode: "off"}}
expect:
  - {invariant: target_never_empty}
  - {invariant: no_rejected_commands}
  - {check: "room.schlafzimmer.override_active == true and room.schlafzimmer.cool_target == 21.0", at: "+2d16h", label: cool_only override holds 21 °C}
  # v1.7.6/v1.7.7 filled the missing heat side with the room temperature, which lifted the
  # cool target to it: 9 starts, 10 off commands, the unit off 45 % of the override at
  # 23.7-25.2 °C. Since 96c71d8 (v1.7.8) it cools through, 21.8-24.2 °C.
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d16h00m", label: cool_only room cools +2d16h00m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d16h15m", label: cool_only room cools +2d16h15m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d16h30m", label: cool_only room cools +2d16h30m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d16h45m", label: cool_only room cools +2d16h45m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d17h00m", label: cool_only room cools +2d17h00m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d17h15m", label: cool_only room cools +2d17h15m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d17h30m", label: cool_only room cools +2d17h30m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d17h45m", label: cool_only room cools +2d17h45m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d18h00m", label: cool_only room cools +2d18h00m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d18h15m", label: cool_only room cools +2d18h15m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d18h30m", label: cool_only room cools +2d18h30m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d18h45m", label: cool_only room cools +2d18h45m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d19h00m", label: cool_only room cools +2d19h00m}
  - {check: "room.schlafzimmer.mode == 'cooling' and dev('climate.sz_ac').mode == 'cool'", at: "+2d19h15m", label: cool_only room cools +2d19h15m}
  - {check: "room.wohnzimmer.override_active == true and room.wohnzimmer.heat_target == 21.0", at: "+2d16h", label: auto override is a band from 21 °C}
  - {check: "room.wohnzimmer.mode == 'cooling'", at: "+2d17h30m", label: auto room cools}
  - {check: "room.wohnzimmer.mode == 'cooling'", at: "+2d19h", label: auto room cools until the override ends}
  # Direct units hold the target in their own deadband, compressor on ~0.5 K past it. v1.7.9 to
  # v1.8.0 switched them off the moment the room read the target, a few minutes into a run the
  # unit ends by itself, and on again 30-90 s later: seeds 1-3 sz 43/39/45, wz 46/44/51 starts
  # per day. Since the run is the unit's own (up to 0.5 K past the target): 3-4 per day, energy +1 %.
  - {metric: device.starts_per_day, entity_id: climate.sz_ac, max: 15, label: direct unit ends its own cooling runs}
  - {metric: device.starts_per_day, entity_id: climate.wz_ac, max: 15, label: direct unit ends its own cooling runs}
